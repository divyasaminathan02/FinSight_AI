services:
  - type: web
    name: finsight-ai-backend
    env: python
    region: singapore
    plan: starter
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 4"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: finsight-enterprise-db
          property: connectionString
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_API_KEY
        sync: false

databases:
  - name: finsight-enterprise-db
    databaseName: finsight_db
    user: finsight_admin
    region: singapore
    plan: free
